---
# Not loaded by this role: geerlingguy.postgresql resolves its per distribution
# variables with include_vars, whose search path also covers the vars directory
# of the *including* role. Version 4.0.0 stops at Ubuntu-24.yml and aborts on
# Ubuntu 26.04, so the file it looks for is provided from here.
#
# Delete it once geerlingguy.postgresql ships its own Ubuntu-26.yml: the role's
# own vars directory is searched first, so its file would take precedence anyway.
#
# Ubuntu 26.04 (resolute) ships PostgreSQL 18.
__postgresql_version: "18"
__postgresql_data_dir: "/var/lib/postgresql/{{ __postgresql_version }}/main"
__postgresql_bin_path: "/usr/lib/postgresql/{{ __postgresql_version }}/bin"
__postgresql_config_path: "/etc/postgresql/{{ __postgresql_version }}/main"
__postgresql_daemon: postgresql
__postgresql_packages:
  - postgresql
  - postgresql-contrib
  - libpq-dev
postgresql_python_library: python3-psycopg2
