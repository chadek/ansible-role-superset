---
- name: Verify
  hosts: superset_app
  become: true
  gather_facts: false

  vars:
    superset_env:
      SUPERSET_CONFIG_PATH: /etc/superset/superset_config.py
      PYTHONPATH: /etc/superset
      FLASK_APP: superset

  tasks:
    - name: Verify | Collect service facts
      ansible.builtin.service_facts:

    - name: Verify | Superset services are running
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item ~ '.service'].state == 'running'
        fail_msg: "{{ item }}.service is not running"
      loop:
        - superset
        - superset-worker
        - superset-beat

    - name: Verify | Read the generated configuration
      ansible.builtin.slurp:
        src: /etc/superset/superset_config.py
      register: _config

    - name: Verify | Both endpoints are rendered with a driver and with TLS
      ansible.builtin.assert:
        that:
          # postgres:// rewritten, ssl completed from the superset_db fields
          - "'postgresql+psycopg2://superset:' in _rendered"
          - "'postgres://superset' not in _rendered"
          - "'sslmode=verify-full' in _rendered"
          - "'sslrootcert=/usr/local/share/ca-certificates/superset-molecule-ca.crt' in _rendered"
          # valkeys:// normalised, TLS parameters carried over
          - "'rediss://superset:' in _rendered"
          - "'valkeys://' not in _rendered"
          - "'ssl_cert_reqs=required' in _rendered"
        fail_msg: "the managed endpoints were not rendered as expected"
      vars:
        _rendered: "{{ _config.content | b64decode }}"

    - name: Verify | No local database or cache is listening
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ item }}"
        state: stopped
        timeout: 5
      loop:
        - 5432
        - 6379

    - name: Verify | The health endpoint answers OK
      ansible.builtin.uri:
        url: "http://127.0.0.1:8088/health"
        return_content: true
      register: _health
      failed_when: "'OK' not in _health.content"

    - name: Verify | The celery worker answers over the TLS broker
      ansible.builtin.command: >-
        /opt/superset/venv/bin/celery --app=superset.tasks.celery_app:app inspect ping --timeout 30
      environment: "{{ superset_env }}"
      register: _celery_ping
      changed_when: false
      failed_when: "'pong' not in _celery_ping.stdout"

    - name: Verify | The caches and the results backend round-trip over TLS
      ansible.builtin.command:
        argv:
          - /opt/superset/venv/bin/python
          - -c
          - |
            from superset.app import create_app
            app = create_app()
            with app.app_context():
                from superset.extensions import cache_manager
                cache_manager.cache.set("molecule_probe", "cache-ok", timeout=60)
                assert cache_manager.cache.get("molecule_probe") == "cache-ok"
                rb = app.config["RESULTS_BACKEND"]
                rb.set("molecule_probe", b"results-ok", timeout=60)
                assert rb.get("molecule_probe") == b"results-ok"
                print("tls-cache-ok")
      environment: "{{ superset_env }}"
      register: _cache_probe
      changed_when: false
      failed_when: "'tls-cache-ok' not in _cache_probe.stdout"

    # pg_hba only has hostssl lines, so an unencrypted client must be refused:
    # this proves superset really negotiated TLS rather than silently falling back.
    - name: Verify | A plaintext connection to the metadata database is refused
      ansible.builtin.command:
        argv:
          - /opt/superset/venv/bin/python
          - -c
          - |
            import psycopg2
            try:
                psycopg2.connect(
                    host="superset-data", port=5432, dbname="superset",
                    user="superset", password="moleculemanagedpassword",
                    sslmode="disable", connect_timeout=5,
                )
                print("PLAINTEXT-ACCEPTED")
            except Exception:
                print("PLAINTEXT-REFUSED")
      register: _pg_plain
      changed_when: false
      failed_when: "'PLAINTEXT-REFUSED' not in _pg_plain.stdout"

    - name: Verify | The metadata schema was created on the remote database
      ansible.builtin.command:
        argv:
          - /opt/superset/venv/bin/python
          - -c
          - |
            import psycopg2
            c = psycopg2.connect(
                host="superset-data", port=5432, dbname="superset",
                user="superset", password="moleculemanagedpassword",
                sslmode="verify-full",
                sslrootcert="/usr/local/share/ca-certificates/superset-molecule-ca.crt",
            )
            cur = c.cursor()
            cur.execute("SELECT count(*) FROM information_schema.tables WHERE table_name='dashboards'")
            print("dashboards=%d" % cur.fetchone()[0])
      register: _pg_schema
      changed_when: false
      failed_when: "'dashboards=1' not in _pg_schema.stdout"
