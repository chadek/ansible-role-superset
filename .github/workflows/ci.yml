---
name: CI
"on":
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "30 4 * * 1"

# The role is addressed by its directory name (molecule/*/converge.yml uses
# `role: ansible-role-superset` and molecule.yml puts the parent directory on
# ANSIBLE_ROLES_PATH), so the checkout has to land in a directory of that name.
env:
  APP_NAME: ansible-role-superset

defaults:
  run:
    working-directory: ansible-role-superset

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: "${{ env.APP_NAME }}"

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies.
        run: pip3 install yamllint ansible-lint

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint .

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One runner per scenario: the platforms are pinned in each
        # molecule.yml, the default one already covering Debian 12,
        # Ubuntu 24.04 and Ubuntu 26.04.
        scenario:
          - default
          - cluster
          - managed-tls

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: "${{ env.APP_NAME }}"

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Installing apache-superset in every container is what this suite costs,
      # and a hosted runner starts with roughly 25 GB free: the preinstalled
      # toolchains it will never use are dropped first.
      - name: Free up disk space.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install test dependencies.
        run: pip3 install ansible molecule molecule-plugins[docker] docker

      - name: Run Molecule tests.
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
